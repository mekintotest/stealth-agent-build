name: macOS desktop build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6ccf6ad39752c86b0ba41e933671f12e287f0e95 # 1.96.1
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/bin/trunk
            ~/.cargo/registry
            ~/.cargo/git
          key: stealth-macos-tools-v1
      - name: Download encrypted source
        run: curl --fail --location https://github.com/mekintotest/stealth-agent-build/releases/download/source/source.enc -o source.enc
      - name: Decrypt private source
        env:
          SOURCE_KEY: ${{ secrets.SOURCE_KEY }}
        run: node decrypt.mjs && mkdir app && tar -xf source.tar -C app && rm source.tar source.enc
      - name: Install Trunk
        run: command -v trunk || cargo install trunk --version 0.21.14 --locked
      - name: Build UI
        working-directory: app/crates/web
        run: trunk build --release
      - name: Build desktop
        working-directory: app
        run: |
          rustup target add x86_64-apple-darwin aarch64-apple-darwin
          cargo build --release --locked -p mekagent-desktop --target aarch64-apple-darwin
          cargo build --release --locked -p mekagent-desktop --target x86_64-apple-darwin
          mkdir -p target/release
          lipo -create target/aarch64-apple-darwin/release/mekagent-desktop target/x86_64-apple-darwin/release/mekagent-desktop -output target/release/mekagent-desktop
          lipo target/release/mekagent-desktop -verify_arch x86_64 arm64
          cargo test --locked -p mekagent-desktop --target aarch64-apple-darwin
          cargo test --locked -p mekagent-desktop --target x86_64-apple-darwin
      - name: Package app and DMG
        working-directory: app
        run: |
          mkdir -p "target/Stealth Agent.app/Contents/MacOS" "target/Stealth Agent.app/Contents/Resources"
          cp target/release/mekagent-desktop "target/Stealth Agent.app/Contents/MacOS/MEKAGENT"
          cp deploy/desktop/Info.plist "target/Stealth Agent.app/Contents/Info.plist"
          cp deploy/desktop/AppIcon.icns "target/Stealth Agent.app/Contents/Resources/AppIcon.icns"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' "target/Stealth Agent.app/Contents/Info.plist"
          test -s "target/Stealth Agent.app/Contents/Resources/AppIcon.icns" && echo "icon in bundle: $(stat -f %z "target/Stealth Agent.app/Contents/Resources/AppIcon.icns") bytes"
          sips -g pixelWidth -g format "target/Stealth Agent.app/Contents/Resources/AppIcon.icns" || true
          codesign --force --deep --sign - "target/Stealth Agent.app"
          codesign --verify --deep --strict "target/Stealth Agent.app"
          hdiutil create -volname "Stealth Agent Beta" -srcfolder "target/Stealth Agent.app" -ov -format UDZO target/Stealth-Agent-macOS.dmg
          hdiutil verify target/Stealth-Agent-macOS.dmg
          file target/release/mekagent-desktop
          open "target/Stealth Agent.app"
          sleep 8
          pgrep -f 'Stealth Agent.app/Contents/MacOS/MEKAGENT'
          pkill -f 'Stealth Agent.app/Contents/MacOS/MEKAGENT' || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Stealth-Agent-macOS
          path: app/target/Stealth-Agent-macOS.dmg
          retention-days: 7
