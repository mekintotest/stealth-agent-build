name: macOS update end-to-end
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  update:
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - name: Download previously built app (1.0.14)
        uses: actions/download-artifact@v4
        with:
          name: Stealth-Agent-macOS
          run-id: 37751437219
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: old
      - name: Install old app and fetch the published update for comparison
        run: |
          set -x
          mkdir -p "$HOME/Applications" /tmp/oldmnt /tmp/newmnt out
          hdiutil attach old/Stealth-Agent-macOS.dmg -nobrowse -readonly -mountpoint /tmp/oldmnt
          cp -R "/tmp/oldmnt/Stealth Agent.app" "$HOME/Applications/"
          hdiutil detach /tmp/oldmnt
          curl -fsSL https://stealth-agent.mekintotest.workers.dev/downloads/macos -o new.dmg
          hdiutil attach new.dmg -nobrowse -readonly -mountpoint /tmp/newmnt
          APP="$HOME/Applications/Stealth Agent.app"
          BIN="$APP/Contents/MacOS/MEKAGENT"
          echo "OLD_SHA=$(shasum -a 256 "$BIN" | cut -d' ' -f1)" >> "$GITHUB_ENV"
          echo "NEW_SHA=$(shasum -a 256 "/tmp/newmnt/Stealth Agent.app/Contents/MacOS/MEKAGENT" | cut -d' ' -f1)" >> "$GITHUB_ENV"
          hdiutil detach /tmp/newmnt
          codesign --verify --deep --strict "$APP"
          plutil -p "$APP/Contents/Info.plist" | head -20
      - name: Launch, let the app download and stage the update, then close it
        run: |
          set +e
          APP="$HOME/Applications/Stealth Agent.app"
          BIN="$APP/Contents/MacOS/MEKAGENT"
          echo "old=$OLD_SHA new=$NEW_SHA"
          [ "$OLD_SHA" != "$NEW_SHA" ] || echo "WARNING: old and new binaries identical"
          open -n "$APP"
          for i in $(seq 1 30); do pgrep -f "Stealth Agent.app/Contents/MacOS/MEKAGENT" >/dev/null && break; sleep 1; done
          sleep 25
          CACHE="$HOME/Library/Caches/dev.MEK.MEKAGENT"
          echo "--- cache after first launch"; ls -la "$CACHE" 2>&1 | tee out/cache-before-close.txt
          screencapture -x out/mac-window-light.png
          # Try dark appearance (needs Accessibility/Automation; reported either way).
          osascript -e 'tell application "System Events" to tell appearance preferences to set dark mode to true' 2>&1 | tee out/dark-mode-result.txt
          sleep 4; screencapture -x out/mac-window-dark.png
          # Close the window exactly like a user (red button) so the app runs its shutdown path.
          osascript -e 'tell application "System Events" to tell (first process whose name is "MEKAGENT") to click (first button of window 1 whose subrole is "AXCloseButton")' 2>&1 | tee out/close-result.txt
          sleep 60
          echo "--- processes after close"; pgrep -fl "Stealth Agent.app/Contents/MacOS/MEKAGENT" | tee out/processes-after.txt
          echo "--- cache after close"; ls -la "$CACHE" 2>&1 | tee out/cache-after-close.txt
          CUR=$(shasum -a 256 "$BIN" | cut -d' ' -f1)
          echo "current=$CUR" | tee out/result.txt
          if [ "$CUR" = "$NEW_SHA" ]; then echo "RESULT: updated to the published build" | tee -a out/result.txt; elif [ "$CUR" = "$OLD_SHA" ]; then echo "RESULT: still on the old build" | tee -a out/result.txt; else echo "RESULT: unknown binary" | tee -a out/result.txt; fi
          codesign --verify --deep --strict "$APP" 2>&1 | tee -a out/result.txt
          ls -la "$HOME/Library/Caches/dev.MEK.MEKAGENT" "$HOME/Library/Application Support" 2>&1 | head -30 > out/dirs.txt
          screencapture -x out/mac-after.png
          pkill -f "Stealth Agent.app/Contents/MacOS/MEKAGENT" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-update-e2e
          path: out
          retention-days: 3
