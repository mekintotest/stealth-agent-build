name: iOS web view check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim
      - name: Select the newest installed Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
      - name: Download and decrypt the private source
        env:
          SOURCE_KEY: ${{ secrets.SOURCE_KEY }}
        run: |
          curl --fail --location https://github.com/mekintotest/stealth-agent-build/releases/download/source/source.enc -o source.enc
          node decrypt.mjs && mkdir app && tar -xf source.tar -C app && rm source.tar source.enc
      - name: Tauri command line tool and CocoaPods
        run: |
          curl -fsSL -o tauri.zip https://github.com/tauri-apps/tauri/releases/download/tauri-cli-v2.12.1/cargo-tauri-aarch64-apple-darwin.zip
          unzip -q tauri.zip -d "$HOME/.cargo/bin" && chmod +x "$HOME/.cargo/bin/cargo-tauri"
          brew list cocoapods >/dev/null 2>&1 || brew install cocoapods
      - name: Replace the launcher with the real page script and a download attempt (this workflow only)
        working-directory: app/mobile
        run: |
          cp ../crates/web/pwa/ios-app.js ../crates/web/pwa/theme.js ../crates/web/pwa/design-system.css app/
          cat > app/index.html <<'EOF'
          <!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
          <script src="theme.js"></script><link rel="stylesheet" href="design-system.css">
          <style>body{padding:72px 20px;font:15px/1.5 system-ui}code{font-size:13px}</style></head><body>
          <h1>iOS indirme denemesi</h1><p id="s">bekleniyor…</p>
          <script src="ios-app.js"></script>
          <script>
          const s = document.getElementById('s');
          s.textContent = 'betik etkin: ' + document.documentElement.classList.contains('in-ios-app');
          // A script-made download with no tap behind it: the share sheet must refuse, and the page must then ask with a button.
          setTimeout(() => {
            const a = document.createElement('a');
            a.href = URL.createObjectURL(new Blob(['merhaba'], { type: 'text/plain' }));
            a.download = 'deneme.txt';
            a.click();
            s.textContent += ' · indirme istendi';
          }, 1500);
          </script></body></html>
          EOF
      - name: Generate the Xcode project and build for the simulator
        working-directory: app/mobile/src-tauri
        run: |
          cargo tauri ios init --ci 2>&1 | tail -3
          cargo tauri ios build --ci --debug --target aarch64-sim 2>&1 | tail -4
      - name: Run it and take a screenshot
        working-directory: app/mobile/src-tauri
        run: |
          set +e
          mkdir -p "$GITHUB_WORKSPACE/out"
          APP="$PWD/gen/apple/build/arm64-sim/Stealth Agent.app"
          UDID=$(xcrun simctl list devices available | grep -E "iPhone (15|16|17)" | head -1 | grep -oE '[0-9A-F-]{36}')
          xcrun simctl boot "$UDID"; xcrun simctl bootstatus "$UDID" -b >/dev/null
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" dev.stealthagent.app
          sleep 12
          xcrun simctl io "$UDID" screenshot "$GITHUB_WORKSPACE/out/ios-webview-check.png"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stealth-ios-check
          path: out
          retention-days: 7
